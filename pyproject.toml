[build-system]
requires = ["setuptools>=68.0.0", "wheel>=0.40.0", "cmake>=3.22.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ring-packet-filter"
version = "0.1.0"
description = "High-performance ring buffer packet filter in Python with C/C++ extensions"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
]

[tool.setuptools]
packages = ["py_ring_packet_filter"]

[tool.setuptools.package-data]
py_ring_packet_filter = ["*.pyi", "py.typed"]

[tool.distutils.bdist_wheel]
universal = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.poe.tasks]
all = ["clean", "build", "test"]

[tool.poe.tasks.build]
shell = """
python -m pip install --upgrade pip
CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS='-O3 -Wall -Wextra' -DCMAKE_CXX_FLAGS='-O3 -Wall -Wextra'" python -m pip install -e .[dev]
"""

[tool.poe.tasks.test]
shell = """
if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
    pytest;
else
    echo "Tests directory is missing or empty. Skipping tests.";
fi
"""

[tool.poe.tasks.benchmark]
shell = """
if [ -d "benchmarks" ] && [ "$(ls -A benchmarks)" ]; then
    pytest --benchmark-only;
elif [ -d "tests" ] && [ "$(ls -A tests)" ]; then
    pytest --benchmark-only;
else
    echo "No benchmarks or tests found to benchmark. Skipping.";
fi
"""

[tool.poe.tasks.clean]
shell = """
rm -rf build/ dist/ *.egg-info .pytest_cache .eggs
find . -type f -name '*.so' -delete
find . -type f -name '*.pyd' -delete
find . -type f -name '*.pyc' -delete
find . -type d -name '__pycache__' -exec rm -rf {} +
"""